services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizmastergogo
      POSTGRES_PASSWORD: quizmastergogo
      POSTGRES_DB: quizmastergogo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizmastergogo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://quizmastergogo:quizmastergogo@postgres:5432/quizmastergogo
      DIRECT_URL: postgresql://quizmastergogo:quizmastergogo@postgres:5432/quizmastergogo
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production

volumes:
  postgres_data:
